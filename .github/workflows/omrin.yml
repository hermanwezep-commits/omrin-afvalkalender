
name: Omrin afvalkalender

on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * *'

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Benodigdheden installeren
        run: pip install requests icalendar

      - name: Afvalkalender ophalen
        env:
          POSTCODE: ${{ secrets.OMRIN_POSTCODE }}
          HUISNUMMER: ${{ secrets.OMRIN_HUISNUMMER }}
        run: |
          python omrin.py "$POSTCODE" "$HUISNUMMER" -o omrin.ics

      - name: Kalender opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add omrin.ics
          if ! git diff --cached --quiet; then
            git commit -m "Update afvalkalender"
            git push
          fi
